<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
    class Student {
  constructor(id, name, grades, attendance) {
    this.id = id;
    this.name = name;
    this.grades = grades;
    this.attendance = attendance;
  }

  getAverage() {
    let total = this.grades.reduce((sum, grade) => sum + grade, 0);
    return total / this.grades.length;
  }

  getGrade() {
    let avg = this.getAverage();
    if (avg >= 90) {
      return "A";
    } else if (avg >= 80) {
      return "B";
    } else if (avg >= 70) {
      return "C";
    } else if (avg >= 60) {
      return "D";
    } else if (avg >= 50) {
      return "E";
    } else {
      return "F";
    }
  }

  getFinalResult() {
    let avg = this.getAverage();
    if (avg >= 50 && this.attendance >= 75) {
      return "ناجح";
    } else {
      return "يحتاج مراجعة";
    }
  }
}

let studentsList = [
  new Student(1, "مريم", [90, 85, 80], 90),
  new Student(2, "يارا", [40, 42, 44], 80),
  new Student(3, "عمر", [95, 90, 85], 95),
  new Student(4, "ليلى", [45, 50, 49], 70)
];

for (let student of studentsList) {
  console.log("الاسم: " + student.name + " المتوسط: " + student.getAverage() + " التقدير: " + student.getGrade() + " النتيجة: " + student.getFinalResult());
}

let struggling = studentsList.filter(student => {
  let avg = student.getAverage();
  return avg >= 40 && avg <= 49;
});

let newGrades = struggling.map(student => student.getAverage() + 5);

let totalAfter = newGrades.reduce((sum, avg) => sum + avg, 0);

let finalAverage = 0;
if (newGrades.length > 0) {
  finalAverage = totalAfter / newGrades.length;
}

console.log("الطلاب المتعثرين الذين شملتهم الرأفة");
console.log(struggling);
console.log("متوسط درجات الطلاب المتعثرين بعد التعديل: " + finalAverage);
   </script> 
</body>
</html>
